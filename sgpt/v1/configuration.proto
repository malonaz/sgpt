syntax = "proto3";

package sgpt.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "malonaz/ai/ai_engine/v1/ai_engine.proto";

option go_package = "github.com/malonaz/sgpt/genproto/sgpt/v1";

// Configuration for the sgpt tool.
message Configuration {
  // Named gRPC clients, referenced elsewhere by name.
  repeated GrpcClient grpc_clients = 1;

  // Name of the gRPC client to use for the AI service.
  string ai_service = 2;

  // Model aliases.
  repeated Model models = 3;

  // Chat configuration.
  ChatConfiguration chat = 4;

  // Ignore patterns (gitignore syntax) applied on top of .gitignore files
  // whenever sgpt walks directory trees (graph scans, file discovery).
  repeated string ignore = 6;

  // Human-readable title: a few lines about the repo this configuration
  // (or configuration override) belongs to.
  string title = 7;

  // External repos whose graph nodes and roles are addressable as
  // "@{name}@{selector}" (e.g. "@github.com/malonaz/core@go/grpc:architecture"
  // or --role "@github.com/malonaz/core@reviewer").
  repeated Import imports = 8;
}

// An external repo, imported by local path.
message Import {
  // Name of the import (e.g. "github.com/malonaz/core").
  string name = 1 [(buf.validate.field).required = true];

  // Absolute path (or ~-prefixed) of the repo's root directory.
  string path = 2 [(buf.validate.field).required = true];
}

// gRPC client configuration.
message GrpcClient {
  // Unique identifier for this client.
  string name = 1 [(buf.validate.field).required = true];

  // Base URL of the gRPC service.
  string base_url = 2 [(buf.validate.field).required = true];

  // API key for authentication.
  string api_key = 3;

  // API key header for authentication.
  string api_key_header = 4;
}

// A model with an optional alias for convenience.
message Model {
  // The resource name of the model.
  // Format: providers/{provider}/models/{model}
  string name = 1 [
    (google.api.resource_reference).type = "ai.malonaz.com/Model",
    (buf.validate.field).required = true
  ];

  // Short alias for the model.
  string alias = 2;
}

// Chat-specific configuration.
message ChatConfiguration {
  // The user under which chats are created and listed.
  // Format: organizations/{organization}/users/{user}
  string user = 1 [(google.api.resource_reference).type = "ai.malonaz.com/User"];

  // The resource name of the model used to generate summaries.
  // Format: providers/{provider}/models/{model}
  string summary_model = 2 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];

  // The resource name of the default model.
  // Format: providers/{provider}/models/{model}
  string default_model = 3 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];

  // The default role selector (e.g. "//path/to:role" or a root role title).
  string default_role = 4;
}

// A role defines a persona with a system prompt. Persisted as a
// `.sgpt/{title}.role.md` markdown file — `@directive(...)` lines carry the
// structured fields, the body is the prompt — and addressed like graph
// nodes ("//dir:title", "@import//dir:title").
message Role {
  // Name of this role: its selector ("//dir:title"), derived from the file
  // location. Never written in the file.
  string name = 1;

  // Short alias for this role (`@alias("go")`).
  string alias = 2;

  // System prompt for this role: the markdown body.
  string prompt = 3;

  // The resource name of the model to use for this role (`@model("...")`).
  // Format: providers/{provider}/models/{model}
  string model = 4 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];

  // Files to include as context for this role (`@file("path")`).
  repeated string files = 5;

  // Tools to include as part of this role (`@tool("exec_shell")`).
  repeated string tools = 6;

  // Selectors of other roles to include (`@role("//dir:title")`). Included
  // roles are expanded depth-first: their prompts are prepended and their
  // files/tools/nodes merged.
  repeated string roles = 7;

  // Knowledge-graph nodes to inject as context for this role
  // (`@node("//dir:title")`), using -g selector syntax.
  repeated string graph_nodes = 8;
}

// A remote tool engine that provides tool sets via gRPC. Persisted as a
// `.sgpt/{title}.toolset` file; discovered and addressed like graph nodes
// ("//dir:title", "@import//dir:title").
message ToolSet {
  // Name of this tool set: its selector ("//dir:title"). Maintained by
  // sgpt, never read from the file.
  string name = 1;

  // Name of the gRPC client to use for the engine service.
  string engine_service = 2 [(buf.validate.field).required = true];

  // Tool set definitions to create from this engine.
  repeated malonaz.ai.ai_engine.v1.CreateServiceToolSetRequest tool_sets = 3;
}
