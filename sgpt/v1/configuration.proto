syntax = "proto3";

package sgpt.v1;

import "buf/validate/validate.proto";
import "google/api/resource.proto";
import "malonaz/ai/ai_engine/v1/ai_engine.proto";

option go_package = "github.com/malonaz/sgpt/genproto/sgpt/v1";

// Configuration for the sgpt tool.
message Configuration {
  // Named gRPC clients, referenced elsewhere by name.
  repeated GrpcClient grpc_clients = 1;

  // Name of the gRPC client to use for the AI service.
  string ai_service = 2;

  // Model aliases.
  repeated Model models = 3;

  // Chat configuration.
  ChatConfiguration chat = 4;

  // Tool sets provided by remote gRPC tool engines.
  repeated ToolSet tool_sets = 5;
}

// gRPC client configuration.
message GrpcClient {
  // Unique identifier for this client.
  string name = 1 [(buf.validate.field).required = true];

  // Base URL of the gRPC service.
  string base_url = 2 [(buf.validate.field).required = true];

  // API key for authentication.
  string api_key = 3;

  // API key header for authentication.
  string api_key_header = 4;
}

// A model with an optional alias for convenience.
message Model {
  // The resource name of the model.
  // Format: providers/{provider}/models/{model}
  string name = 1 [
    (google.api.resource_reference).type = "ai.malonaz.com/Model",
    (buf.validate.field).required = true
  ];

  // Short alias for the model.
  string alias = 2;
}

// Chat-specific configuration.
message ChatConfiguration {
  // The user under which chats are created and listed.
  // Format: organizations/{organization}/users/{user}
  string user = 1 [(google.api.resource_reference).type = "ai.malonaz.com/User"];

  // The resource name of the model used to generate summaries.
  // Format: providers/{provider}/models/{model}
  string summary_model = 2 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];

  // The resource name of the default model.
  // Format: providers/{provider}/models/{model}
  string default_model = 3 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];

  // The default role alias or name.
  string default_role = 4;

  // User-defined roles.
  repeated Role roles = 5;
}

// A role defines a persona with a system prompt.
message Role {
  // Name of this role.
  string name = 1 [(buf.validate.field).required = true];

  // Short alias for this role.
  string alias = 2;

  // System prompt for this role.
  string prompt = 3 [(buf.validate.field).required = true];

  // The resource name of the model to use for this role.
  // Format: providers/{provider}/models/{model}
  string model = 4 [(google.api.resource_reference).type = "ai.malonaz.com/Model"];

  // Files to include as context for this role.
  repeated string files = 5;

  // Tools to include as part of this role.
  repeated string tools = 6;

  // Names or aliases of other roles to include. Included roles are expanded
  // depth-first: their prompts are prepended and their files/tools merged.
  repeated string roles = 7;
}

// A remote tool engine that provides tool sets via gRPC.
message ToolSet {
  // Human-readable name for this tool set (e.g. "onikisu").
  string name = 1 [(buf.validate.field).required = true];

  // Name of the gRPC client to use for the engine service.
  string engine_service = 2 [(buf.validate.field).required = true];

  // Tool set definitions to create from this engine.
  repeated malonaz.ai.ai_engine.v1.CreateServiceToolSetRequest tool_sets = 3;
}
