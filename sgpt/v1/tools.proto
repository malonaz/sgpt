syntax = "proto3";

package sgpt.v1;

import "google/api/field_behavior.proto";

option go_package = "github.com/malonaz/sgpt/genproto/sgpt/v1";

// ToolService declares the built-in tools. It is never served: reflection
// schema resolution only fetches files reachable from a listed service, and
// tool definitions are built from its methods — descriptions from method
// comments, JSON schemas from request messages, auto-execution from the
// idempotency level.
service ToolService {
  // Edit a file by applying a unified diff. Start each hunk with an '@@'
  // line; line numbers in hunk headers are ignored, so they may be wrong or
  // omitted. Prefix unchanged context lines with a space, removed lines with
  // '-' and added lines with '+'. Include enough context lines to anchor
  // each hunk uniquely within the file. Hunks are applied sequentially.
  rpc Diff(DiffRequest) returns (DiffResponse);

  // Edit a file by applying one or more patches. Each patch replaces an
  // exact, unique occurrence of `search` with `replace`. Include enough
  // surrounding context in `search` to make it unique within the file.
  // Patches are applied sequentially.
  rpc Replace(ReplaceRequest) returns (ReplaceResponse);

  // Read the contents of one or more files. Use this to examine file
  // contents before making changes or to understand code structure.
  rpc ReadFiles(ReadFilesRequest) returns (ReadFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Look at an image file (PNG, JPEG, GIF or WebP). Use this to see
  // screenshots, diagrams or photos; read_files cannot show images.
  rpc ReadImage(ReadImageRequest) returns (ReadImageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Read a PDF document, including its layout, tables and figures. Use
  // this for PDFs; read_files cannot parse them.
  rpc ReadDocument(ReadDocumentRequest) returns (ReadDocumentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Execute a shell command on the user's system. Use this when the user
  // asks you to run commands, create files, or perform system operations.
  rpc ExecShell(ExecShellRequest) returns (ExecShellResponse);

  // Search the selected lore libraries (the agent-curated knowledge base,
  // stored under each repo's .sgpt/lores) with a grep-style regular
  // expression. Returns the top matching lores with their title,
  // description and matching snippets; read a full lore via its file at
  // {repo}/.sgpt/lores/{id}.md (ids may contain "/" subdirectory
  // segments; "@import//" prefixes name an imported repo's library).
  rpc SearchLores(SearchLoresRequest) returns (SearchLoresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Launch one or more sub-agents, each in its own chat tab, and return at
  // once with one operation per task. Every task runs concurrently with its
  // own fresh context: the shared `context` plus its own `query`, and nothing
  // from this conversation. Write everything a task needs to know —
  // background, constraints, what to report back — once in `context` rather
  // than repeating it per task. A sub-agent's final message is its report:
  // when it finishes you receive it as a message (and wake up if you were
  // idle), unless you were already blocked on it in `wait_operations`. You
  // can keep working meanwhile, or call `wait_operations` to block. Use this
  // to fan out independent work (explore several areas, refactor many files,
  // run parallel investigations) while you keep the overall picture.
  // Sub-agents inherit this chat's tools unless `tools` narrows them, and
  // never get more.
  rpc CreateAgents(CreateAgentsRequest) returns (CreateAgentsResponse);

  // Send a message to one of the sub-agents you launched, or to your own
  // launcher with agent "parent". A sub-agent that is working receives it
  // before its next step; an idle one starts a new turn. Messaging a
  // sub-agent returns an operation resolving to its reply (delivered to you
  // like a launch's report); messaging "parent" returns nothing — its answer,
  // if any, arrives as your next message.
  rpc MessageAgent(MessageAgentRequest) returns (MessageAgentResponse);

  // Get the current state of operations you started, without blocking.
  // Returns the response of every finished one.
  rpc GetOperations(GetOperationsRequest) returns (GetOperationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Block until operations you started finish — all of them, or the first
  // with `return_when` ANY. Returns early when the timeout elapses or a
  // message arrives for you (a sub-agent's question, the user typing), so
  // you can react to it; the message follows this result.
  rpc WaitOperations(WaitOperationsRequest) returns (WaitOperationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Cancel operations you started: the sub-agent stops its current turn.
  // It stays available for further messages.
  rpc CancelOperations(CancelOperationsRequest) returns (CancelOperationsResponse);
}

// Request for the `diff` tool.
message DiffRequest {
  // Path of the file to edit.
  string path = 1 [(google.api.field_behavior) = REQUIRED];

  // Unified diff to apply ('@@' line numbers are ignored).
  string diff = 2 [(google.api.field_behavior) = REQUIRED];
}

// Result of the `diff` tool.
message DiffResponse {
  // Path of the edited file.
  string path = 1;

  // Number of hunks applied.
  int32 hunks_applied = 2;
}

// Request for the `replace` tool.
message ReplaceRequest {
  // Path of the file to edit.
  string path = 1 [(google.api.field_behavior) = REQUIRED];

  // Patches applied sequentially, each an exact search/replace.
  repeated Patch patches = 2 [(google.api.field_behavior) = REQUIRED];
}

// A single exact search/replace edit.
message Patch {
  // Exact text to find (must match exactly once unless replace_all).
  string search = 1 [(google.api.field_behavior) = REQUIRED];

  // Replacement text.
  string replace = 2 [(google.api.field_behavior) = REQUIRED];

  // Replace every occurrence instead of requiring a unique match.
  bool replace_all = 3;
}

// Result of the `replace` tool.
message ReplaceResponse {
  // Path of the edited file.
  string path = 1;

  // Number of patches applied.
  int32 patches_applied = 2;
}

// Request for the `read_files` tool.
message ReadFilesRequest {
  // List of file paths to read.
  repeated string paths = 1 [(google.api.field_behavior) = REQUIRED];
}

// Result of the `read_files` tool.
message ReadFilesResponse {
  // A single file read attempt.
  message File {
    // Path of the file.
    string path = 1;

    // File contents; empty if the read failed.
    string content = 2;

    // Read error, if any; other files are still returned.
    string error = 3;
  }

  // One entry per requested path, in request order.
  repeated File files = 1;
}

// Request for the `read_image` tool.
message ReadImageRequest {
  // Path of the image file.
  string path = 1 [(google.api.field_behavior) = REQUIRED];
}

// Result of the `read_image` tool: a bare acknowledgment. The image itself
// follows as a user message, since tool results cannot carry images.
message ReadImageResponse {}

// Request for the `read_document` tool.
message ReadDocumentRequest {
  // Path of the PDF file.
  string path = 1 [(google.api.field_behavior) = REQUIRED];
}

// Result of the `read_document` tool: a bare acknowledgment. The document
// itself follows as a user message, since tool results cannot carry
// documents.
message ReadDocumentResponse {}

// Request for the `search_lores` tool.
message SearchLoresRequest {
  // Case-insensitive regular expression (Go/RE2 syntax), run over every
  // lore's title, description, labels and content, grep-style.
  string query = 1 [(google.api.field_behavior) = REQUIRED];

  // Maximum number of lores to return; defaults to 10.
  int32 top_n = 2;
}

// Result of the `search_lores` tool.
message SearchLoresResponse {
  // One matching lore.
  message Match {
    // Resource name of the lore ("lores/{lore}").
    string name = 1;

    // The lore's title.
    string title = 2;

    // The lore's description.
    string description = 3;

    // The lore's labels.
    map<string, string> labels = 4;

    // Matching content lines (grep-style snippets).
    repeated string snippets = 5;

    // Total number of matching lines in the lore's content.
    int32 match_count = 6;
  }

  // Matching lores, best first, capped at top_n.
  repeated Match matches = 1;
}

// Request for the `exec_shell` tool.
message ExecShellRequest {
  // The shell command to execute.
  string command = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional working directory for the command execution. If not specified,
  // uses current directory.
  string working_directory = 2;
}

// Result of the `exec_shell` tool.
message ExecShellResponse {
  // Combined stdout and stderr of the command.
  string output = 1;

  // Process exit code; 0 on success.
  int32 exit_code = 2;

  // Set when the command failed to start or exited non-zero.
  string error = 3;
}

// Request for the `create_agents` tool.
message CreateAgentsRequest {
  // Briefing shared by every task, prepended to each sub-agent's system
  // prompt: background, constraints, conventions, expected output format.
  string context = 1;

  // Tasks to run concurrently, one sub-agent each.
  repeated AgentTask tasks = 2 [(google.api.field_behavior) = REQUIRED];

  // File paths injected into every sub-agent's context.
  repeated string files = 3;

  // Tools granted to every sub-agent, narrowing this chat's own tools;
  // unset inherits them all. Names outside this chat's tools are rejected.
  repeated string tools = 4;

  // Model for every sub-agent (name or alias); unset inherits this chat's.
  string model = 5;
}

// One sub-agent's task.
message AgentTask {
  // Short human-readable title for the sub-agent's chat (a few words).
  string title = 1 [(google.api.field_behavior) = REQUIRED];

  // The task itself; the shared `context` is already in the sub-agent's
  // system prompt, so state only what is specific to this task.
  string query = 2 [(google.api.field_behavior) = REQUIRED];

  // File paths injected into this sub-agent's context, on top of the shared
  // ones.
  repeated string files = 3;

  // Model override for this task (name or alias).
  string model = 4;
}

// Result of the `create_agents` tool.
message CreateAgentsResponse {
  // One operation per task, in request order.
  repeated AgentOperation operations = 1;
}

// One sub-agent turn: a launch or a message, resolving to the sub-agent's
// final message once that turn ends.
message AgentOperation {
  // The operation's state.
  enum State {
    // Used to detect an unset field.
    STATE_UNSPECIFIED = 0;
    // Waiting for a free sub-agent slot.
    STATE_QUEUED = 1;
    // The sub-agent is working.
    STATE_RUNNING = 2;
    // The sub-agent is blocked on the user's review of a tool call.
    STATE_AWAITING_REVIEW = 3;
    // Finished: `response` holds the sub-agent's final message.
    STATE_SUCCEEDED = 4;
    // Finished without an answer: `error` says why.
    STATE_FAILED = 5;
    // Cancelled before it finished.
    STATE_CANCELLED = 6;
  }

  // Resource name of the operation ("operations/{operation}").
  string name = 1;

  // Resource name of the sub-agent ("agents/{agent}"), the handle to
  // message it.
  string agent = 2;

  // The sub-agent's title.
  string title = 3;

  // The operation's state.
  State state = 4;

  // The sub-agent's final message; set once succeeded.
  string response = 5;

  // Why the operation produced no answer; set once failed or cancelled.
  string error = 6;
}

// Request for the `message_agent` tool.
message MessageAgentRequest {
  // Recipient: the name of a sub-agent you launched ("agents/{agent}"), or
  // "parent" for your own launcher.
  string agent = 1 [(google.api.field_behavior) = REQUIRED];

  // The message.
  string text = 2 [(google.api.field_behavior) = REQUIRED];
}

// Result of the `message_agent` tool.
message MessageAgentResponse {
  // The operation resolving to the sub-agent's reply; unset when messaging
  // "parent".
  AgentOperation operation = 1;
}

// Request for the `get_operations` tool.
message GetOperationsRequest {
  // Operations to get; empty gets every operation you started.
  repeated string names = 1;
}

// Result of the `get_operations` tool.
message GetOperationsResponse {
  // The operations, in request order (oldest first when listing all).
  repeated AgentOperation operations = 1;
}

// Request for the `wait_operations` tool.
message WaitOperationsRequest {
  // When a wait over several operations returns.
  enum ReturnWhen {
    // Used to detect an unset field; behaves as ALL.
    RETURN_WHEN_UNSPECIFIED = 0;
    // Once every operation has finished.
    RETURN_WHEN_ALL = 1;
    // As soon as any operation has finished.
    RETURN_WHEN_ANY = 2;
  }

  // Operations to wait for; empty waits for every unfinished operation you
  // started.
  repeated string names = 1;

  // When to return; defaults to ALL.
  ReturnWhen return_when = 2;

  // Longest time to block, in seconds; defaults to 600.
  int32 timeout_seconds = 3;
}

// Result of the `wait_operations` tool.
message WaitOperationsResponse {
  // Why the wait returned.
  enum Reason {
    // Used to detect an unset field.
    REASON_UNSPECIFIED = 0;
    // The operations finished as requested by `return_when`.
    REASON_COMPLETED = 1;
    // The timeout elapsed first.
    REASON_TIMEOUT = 2;
    // A message arrived for you first; it follows this result.
    REASON_MESSAGE = 3;
  }

  // Why the wait returned.
  Reason reason = 1;

  // The waited-for operations, in request order.
  repeated AgentOperation operations = 2;
}

// Request for the `cancel_operations` tool.
message CancelOperationsRequest {
  // Operations to cancel.
  repeated string names = 1 [(google.api.field_behavior) = REQUIRED];
}

// Result of the `cancel_operations` tool.
message CancelOperationsResponse {
  // The operations, in request order; finished ones are left untouched.
  repeated AgentOperation operations = 1;
}
