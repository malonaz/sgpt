syntax = "proto3";

package sgpt.v1;

import "malonaz/codegen/aip/v1/label.proto";

option go_package = "github.com/malonaz/sgpt/genproto/sgpt/v1";
// ---------------------------------------------------------------------------
// Chat
// ---------------------------------------------------------------------------
option (malonaz.codegen.aip.v1.label) = {
  key: "sgpt.com/favorite"
  description: "Marks a chat as a favorite."
};
option (malonaz.codegen.aip.v1.label) = {
  key: "sgpt.com/parent-chat"
  description: "ID segment of the chat that launched this sub-agent chat."
};
// ---------------------------------------------------------------------------
// Message
// ---------------------------------------------------------------------------
option (malonaz.codegen.aip.v1.label) = {
  key: "sgpt.com/injected-file"
  description: "Marks a user message carrying the content of an injected file. The file path lives in the sgpt.com/file-path annotation."
};
option (malonaz.codegen.aip.v1.label) = {
  key: "sgpt.com/context"
  description: "Marks a message injected by sgpt as context (system prompt, injected files) rather than typed by the user."
};
